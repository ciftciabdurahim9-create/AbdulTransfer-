
name: AbdulTransfer APK Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android projesini hazırla
        working-directory: android-app
        run: |
          npm install
          mkdir -p www
          echo '<!doctype html><html><head><meta charset="utf-8"></head><body>AbdulTransfer</body></html>' > www/index.html
          npx cap add android
          npx cap sync android

      - name: APK oluştur
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AbdulTransfer-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          
